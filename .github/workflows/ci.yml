name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes a running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  library:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/toolchain
      - name: Build the release assets
        run: tools/build_lib.sh
      - name: Each .text equals its proofs artifact
        run: |
          for a in chacha20poly1305 blake2s x25519; do
            python3 -I proofs/tools/extract_release.py "build/lib/$a/m0crypto_$a.o" \
              "proofs/assets/$a/artifact/M0Crypto/Artifacts/Release.lean" --check
          done
      - name: QEMU tests
        run: tools/test_qemu.sh
      - name: Release archives
        run: python3 -I tools/release.py
      - uses: actions/upload-artifact@v7
        with:
          name: release-archives
          path: build/release/

  proofs:
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/toolchain
      - name: Lean (the version in lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # Lake starts one Lean process per core regardless of memory: build under a budget first,
      # so that check.sh's own lake build finds the workspaces up to date.
      - name: Build the proofs
        env:
          M0C_BUILD_MEM_GB: "12"
        run: |
          for a in chacha20poly1305 blake2s x25519; do
            (cd "proofs/assets/$a" && python3 ../../tools/membuild.py)
          done
      - name: Release gate
        run: proofs/tools/check.sh
      # comparator.sh sandboxes lake comparator and lake check with bwrap, which needs the
      # unprivileged user namespaces that Ubuntu blocks by default. The sandbox hides /home, where
      # the checkout is, and the asset workspaces read ../../lean, so the comparator runs on the
      # proofs tree mounted again under /srv.
      - name: Comparator and kernel replay
        run: |
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo mkdir /srv/proofs
          sudo mount --bind "$PWD/proofs" /srv/proofs
          /srv/proofs/tools/comparator.sh

  # Each mutant must be caught: by the tests or the model checks (AEAD), by the model checks or
  # the constant-time certificate (X25519), by the proofs (BLAKE2s).
  mutation:
    name: mutation (${{ matrix.name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ChaCha20-Poly1305
            run: python3 -I proofs/tools/mutate_aead.py
          - name: X25519
            run: |
              tools/build_lib.sh x25519
              python3 -I proofs/tools/mutate_x25519.py --exec
              python3 -I proofs/tools/mutate_x25519.py --exec --cert --only "branch on secret carry"
          - name: BLAKE2s
            run: python3 -I proofs/tools/mutate_blake2s.py
    env:
      M0C_BUILD_MEM_GB: "12"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/toolchain
      - name: Lean (the version in lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Mutants
        run: ${{ matrix.run }}
