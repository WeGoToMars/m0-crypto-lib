  <text x="32" y="452" font-size="11" fill="#94a3b8">‡ OpenSSL&#x27;s internal portable C functions, called directly; its public API (EVP) does not build for this target.</text><text x="32" y="468" font-size="11" fill="#94a3b8">† Research implementation in hand-written ARMv6-M assembly, provided here as reference (T. Pornin, github.com/pornin/x25519-cm0).</text><text x="32" y="484" font-size="11" fill="#94a3b8">   Its field inversion: T. Pornin, “Optimized Binary GCD for Modular Inversion”, IACR Cryptology ePrint Archive 2020/972.</text>
