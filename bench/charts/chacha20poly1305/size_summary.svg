  <text x="32" y="452" font-size="11" fill="#94a3b8">‡ OpenSSL&#x27;s internal portable C functions, called directly; its public API (EVP) does not build for this target.</text><text x="32" y="468" font-size="11" fill="#94a3b8">   Its ChaCha20-Poly1305 composes OpenSSL&#x27;s ChaCha20 and Poly1305 kernels in benchmark code (RFC 8439).</text>
